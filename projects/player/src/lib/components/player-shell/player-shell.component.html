<div class="player-shell" [class.has-error]="hasError">
  <!-- Loading state -->
  @if (loading) {
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading PanelWave...</p>
    </div>
  }

  <!-- Error state -->
  @if (hasError && !loading) {
    <div class="error-container">
      <div class="error-icon">⚠️</div>
      <h2 class="error-title">Unable to load content</h2>
      <p class="error-message">{{ errorMessage }}</p>
      <button class="retry-button" type="button" (click)="ngOnInit()">
        Retry
      </button>
    </div>
  }

  <!-- Main player -->
  @if (!loading && !hasError && currentPanel) {
    <div class="player-content">
      <!-- Viewport -->
      <pw-viewport
        [panel]="currentPanel"
        [viewMode]="viewMode"
        [reducedMotion]="reducedMotion"
        [locale]="locale"
        [interactive]="true"
        [showOverflowArrows]="true"
        (viewportClick)="onViewportClick()">
      </pw-viewport>

      <!-- Full Toolbar -->
      <pw-toolbar
        [visible]="toolbarVisible"
        [locale]="locale"
        [availableLocales]="['en-US', 'de-DE']"
        [viewMode]="viewMode"
        [pageViewAvailable]="false"
        [speechEnabled]="true"
        [audioEnabled]="true"
        [sfxEnabled]="true"
        [autoplayEnabled]="false"
        [secondsPerPanel]="5"
        [thumbnailsVisible]="false"
        [hasAlternatives]="false"
        [hasBranches]="false"
        [showSocial]="true"
        (toggleView)="onToggleView()"
        (localeChange)="onLocaleChange($event)"
        (toggleSpeech)="onToggleSpeech()"
        (toggleAudio)="onToggleAudio()"
        (toggleSfx)="onToggleSfx()"
        (toggleAutoplay)="onToggleAutoplay()"
        (secondsPerPanelChange)="onSecondsPerPanelChange($event)"
        (toggleThumbnails)="onToggleThumbnails()"
        (openToc)="onOpenToc()"
        (openSettings)="onOpenSettings()"
        (openCharacters)="onOpenCharacters()"
        (cycleAlternative)="onCycleAlternative()"
        (showBranches)="onShowBranches()"
        (openExtras)="onOpenExtras()"
        (like)="onLike()"
        (bookmark)="onBookmark()"
        (share)="onShare()"
        (openComments)="onOpenComments()"
        (close)="toggleToolbar()">
      </pw-toolbar>

      <!-- PanelWave floating icon -->
      @if (!toolbarVisible) {
        <button 
          class="floating-icon"
          type="button"
          aria-label="Show toolbar"
          (click)="toggleToolbar()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
      }

      <!-- Modals will be integrated once component compilation errors are resolved -->
      <!-- Modal visibility is controlled by toolbar buttons for now via console logs -->
    </div>
  }
</div>
