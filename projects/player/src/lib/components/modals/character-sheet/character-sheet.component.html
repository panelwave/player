@if (visible && character) {
  <div class="sheet-overlay" (click)="onBackdropClick($event)" (keydown)="onBackdropKeydown($event)">
    <div class="sheet-container" role="dialog" aria-modal="true" [attr.aria-label]="'Character: ' + getCharacterName()">
      <!-- Header -->
      <div class="sheet-header">
        <h2 class="sheet-title">{{ getCharacterName() }}</h2>
        <button
          class="close-btn"
          type="button"
          aria-label="Close character sheet"
          (click)="onClose()">
          ✕
        </button>
      </div>

      <!-- Content -->
      <div class="sheet-content">
        <!-- Portrait -->
        <div class="portrait-section">
          <div class="portrait-container">
            @if (getPortraitUrl()) {
              <img
                [src]="getPortraitUrl()"
                [alt]="getCharacterName()"
                class="portrait-image" />
            } @else {
              <div class="portrait-placeholder">
                {{ getInitials() }}
              </div>
            }
          </div>

          <!-- Role badge -->
          @if (character['role']) {
            <div class="role-badge">
              {{ character['role'] }}
            </div>
          }

          <!-- Voice sample button -->
          @if (hasVoiceSample()) {
            <button
              class="voice-btn"
              [class.playing]="isPlaying"
              type="button"
              (click)="playVoiceSample()">
              <span class="voice-icon">{{ isPlaying ? '⏸️' : '🔊' }}</span>
              <span class="voice-label">{{ isPlaying ? 'Stop' : 'Play' }} Voice Sample</span>
            </button>
          }
        </div>

        <!-- Bio -->
        <div class="bio-section">
          <h3 class="bio-title">Biography</h3>
          @if (getCharacterBio()) {
            <div class="bio-content">
              {{ getCharacterBio() }}
            </div>
          } @else {
            <p class="bio-empty">No biography available.</p>
          }
        </div>
      </div>

      <!-- Footer -->
      <div class="sheet-footer">
        <button
          class="action-btn"
          type="button"
          (click)="onClose()">
          Close
        </button>
      </div>
    </div>
  </div>
}
