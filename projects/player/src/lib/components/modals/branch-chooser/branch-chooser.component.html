@if (visible) {
  <div
    class="branch-chooser-overlay"
    tabindex="-1"
    (click)="onBackdropClick($event)"
    (keydown.escape)="close.emit()">
    <div
      class="branch-chooser-container"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pw-branch-chooser-title">
      <div class="branch-chooser-header">
        <h2 id="pw-branch-chooser-title" class="branch-chooser-title">{{ t('title') }}</h2>
        <button
          class="close-btn"
          type="button"
          [attr.aria-label]="t('close')"
          (click)="close.emit()">
          <pw-icon name="lucideX" />
        </button>
      </div>

      <ul class="branch-chooser-list">
        @for (choice of choices; track choice.index) {
          <li>
            <button
              class="branch-chooser-option"
              type="button"
              (click)="choose.emit(choice)">
              <span class="branch-chooser-index" aria-hidden="true">{{ choice.index + 1 }}</span>
              <span class="branch-chooser-label">{{ choice.label || t('option', { n: choice.index + 1 }) }}</span>
              <span class="branch-chooser-arrow" aria-hidden="true"><pw-icon name="lucideChevronRight" /></span>
            </button>
          </li>
        }
      </ul>
    </div>
  </div>
}
