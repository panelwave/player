@if (visible) {
  <div class="action-modal-overlay" (click)="onBackdropClick($event)">
    <div class="action-modal-container" role="dialog" aria-modal="true" [attr.aria-label]="resolved(title)">
      <div class="action-modal-header">
        <h2 class="action-modal-title">{{ resolved(title) }}</h2>
        <button
          class="close-btn"
          type="button"
          aria-label="Close"
          (click)="close.emit()">
          <pw-icon name="lucideX" />
        </button>
      </div>
      <!-- Plain text only: manifest content is untrusted, never innerHTML -->
      <div class="action-modal-content">{{ resolved(content) }}</div>
    </div>
  </div>
}
