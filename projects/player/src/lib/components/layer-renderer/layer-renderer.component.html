<div 
  class="layer-wrapper"
  [ngStyle]="getLayerStyles()"
  [style.transform]="getTransformStyle()"
  [class.interactive]="isInteractive()"
  [attr.data-layer-id]="layer.id"
  [attr.data-layer-kind]="layer.kind"
  [tabindex]="isInteractive() ? 0 : -1"
  (click)="isInteractive() ? onLayerClick($event) : null"
  (keydown.enter)="isInteractive() ? onLayerClick($any($event)) : null">

  <!-- Image Layer -->
  @if (layer.kind === 'image') {
    <img 
      [src]="getImageSrc()"
      [alt]="getAltText()"
      class="layer-image"
      loading="lazy" />
  }

  <!-- Video Layer -->
  @if (layer.kind === 'video') {
    <pw-video-layer
      class="layer-video"
      [src]="getVideoSrc()"
      [reverseSrc]="getVideoReverseSrc()"
      [baseUrl]="baseUrl"
      [poster]="getVideoPoster()"
      [controls]="getVideoControls()"
      [playMode]="getVideoPlayMode()"
      [startMode]="getVideoStartMode()"
      [muted]="getVideoMuted()"
      [startAtMs]="getVideoStartAtMs()"
      [loopFromMs]="getVideoLoopFromMs()"
      [streaming]="getVideoStreaming()"
      [viewMode]="viewMode"
      [viewActive]="viewActive"
      [reducedMotion]="reducedMotion"
      [videoId]="layer.id"
      [panelId]="panelId"
      [assetId]="getVideoAssetId()"
      [placementId]="placementId || panelId"
      [readingOrderIndex]="readingOrderIndex"
      [placementZ]="placementZ"
      [placementY]="placementY"
      [placementX]="placementX"
      [ariaLabel]="getAltText()">
    </pw-video-layer>
  }

  <!-- Text Layer -->
  @if (layer.kind === 'text') {
    <div 
      class="layer-text"
      [ngStyle]="getTextStyles()"
      [innerHTML]="getTextContent()">
    </div>
  }

  <!-- Hotspot Layer -->
  @if (layer.kind === 'hotspot') {
    <div 
      class="layer-hotspot"
      role="button"
      tabindex="0"
      [attr.aria-label]="'Interactive hotspot'">
      <div class="hotspot-indicator"></div>
    </div>
  }

  <!-- Button Layer -->
  @if (layer.kind === 'button') {
    <button 
      class="layer-button"
      type="button">
      {{ getTextContent() }}
    </button>
  }

  <!-- SVG Layer -->
  @if (layer.kind === 'svg') {
    <div 
      class="layer-svg"
      [innerHTML]="getSvgContent()">
    </div>
  }

  <!-- Shape Layer -->
  @if (layer.kind === 'shape') {
    <div class="layer-shape" [attr.data-shape]="getShapeType()">
      <!-- Shape rendering would be implemented here -->
    </div>
  }

  <!-- Group Layer (container for nested layers) -->
  @if (layer.kind === 'group') {
    <div class="layer-group">
      <!-- Nested layers would be rendered here -->
    </div>
  }
</div>
