<div class="toolbar-container" [class.visible]="visible">
  <div class="toolbar">
    <!-- Left section: View and navigation controls -->
    <div class="toolbar-section toolbar-left">
      <!-- View toggle (page/panel) -->
      <button
        class="toolbar-btn"
        [class.disabled]="!pageViewAvailable"
        [disabled]="!pageViewAvailable"
        type="button"
        [attr.aria-label]="'toolbar.view_toggle' | translate"
        [attr.title]="'toolbar.view_toggle' | translate"
        (click)="onToggleView()">
        <span class="btn-icon"><pw-icon [name]="viewMode === 'page' ? 'lucideLayoutGrid' : viewMode === 'canvas' ? 'lucideGlobe' : 'lucideSquare'" /></span>
        <span class="btn-label">{{ 'toolbar.view' | translate }}</span>
      </button>

      <!-- Language selector -->
      @if (availableLocales.length > 1) {
        <button
          class="toolbar-btn"
          type="button"
          [attr.aria-label]="'toolbar.select_language' | translate"
          (click)="openLanguage.emit()">
          <span class="btn-icon"><pw-icon name="lucideGlobe" /></span>
          <span class="btn-label">{{ locale }}</span>
        </button>
      }
    </div>

    <!-- Center section: Content controls -->
    <div class="toolbar-section toolbar-center">
      <!-- Speech bubbles toggle -->
      <button
        class="toolbar-btn toggle-btn"
        [class.active]="speechEnabled"
        type="button"
        [attr.aria-label]="'toolbar.speech_toggle' | translate"
        [attr.aria-pressed]="speechEnabled"
        [attr.title]="'toolbar.speech_toggle' | translate"
        (click)="onToggleSpeech()">
        <span class="btn-icon"><pw-icon name="lucideMessageSquare" /></span>
        <span class="btn-label">{{ 'toolbar.speech' | translate }}</span>
      </button>

      <!-- Audio toggle -->
      <button
        class="toolbar-btn toggle-btn"
        [class.active]="audioEnabled"
        type="button"
        [attr.aria-label]="'toolbar.audio_toggle' | translate"
        [attr.aria-pressed]="audioEnabled"
        [attr.title]="'toolbar.audio_toggle' | translate"
        (click)="onToggleAudio()">
        <span class="btn-icon"><pw-icon [name]="audioEnabled ? 'lucideVolume2' : 'lucideVolumeX'" /></span>
        <span class="btn-label">{{ 'toolbar.audio' | translate }}</span>
      </button>

      <!-- SFX toggle -->
      <button
        class="toolbar-btn toggle-btn"
        [class.active]="sfxEnabled"
        type="button"
        [attr.aria-label]="'toolbar.sfx_toggle' | translate"
        [attr.aria-pressed]="sfxEnabled"
        [attr.title]="'toolbar.sfx_toggle' | translate"
        (click)="onToggleSfx()">
        <span class="btn-icon"><pw-icon name="lucideMusic" /></span>
        <span class="btn-label">{{ 'toolbar.sfx' | translate }}</span>
      </button>

      <!-- Autoplay control -->
      <div class="toolbar-dropdown">
        <button
          class="toolbar-btn toggle-btn autoplay-btn"
          [class.active]="autoplayEnabled"
          type="button"
          [attr.aria-label]="'toolbar.autoplay_toggle' | translate"
          [attr.aria-pressed]="autoplayEnabled"
          [attr.title]="'toolbar.autoplay_toggle' | translate"
          (click)="onToggleAutoplay()">
          <span class="btn-icon"><pw-icon [name]="autoplayEnabled ? 'lucidePause' : 'lucidePlay'" /></span>
          <span class="btn-label">{{ 'toolbar.autoplay' | translate }}</span>
          @if (autoplayEnabled) {
            <div class="autoplay-progress-bar">
              <div class="autoplay-progress-fill" [style.width.%]="autoplayProgress"></div>
            </div>
          }
        </button>

        @if (autoplayEnabled) {
          <div class="autoplay-controls">
            <button
              class="control-btn"
              type="button"
              [attr.aria-label]="'toolbar.decrease_speed' | translate"
              (click)="adjustSecondsPerPanel(-1)">
              -
            </button>
            <span class="control-value">{{ 'toolbar.seconds' | translate: {value: secondsPerPanel} }}</span>
            <button
              class="control-btn"
              type="button"
              [attr.aria-label]="'toolbar.increase_speed' | translate"
              (click)="adjustSecondsPerPanel(1)">
              +
            </button>
          </div>
        }
      </div>

      <!-- Thumbnails toggle -->
      <button
        class="toolbar-btn toggle-btn"
        [class.active]="thumbnailsVisible"
        type="button"
        [attr.aria-label]="'toolbar.thumbs_toggle' | translate"
        [attr.aria-pressed]="thumbnailsVisible"
        [attr.title]="'toolbar.thumbs_toggle' | translate"
        (click)="onToggleThumbnails()">
        <span class="btn-icon"><pw-icon name="lucideImages" /></span>
        <span class="btn-label">{{ 'toolbar.thumbs' | translate }}</span>
      </button>
    </div>

    <!-- Right section: Navigation and info controls -->
    <div class="toolbar-section toolbar-right">
      <!-- Table of Contents -->
      <button
        class="toolbar-btn"
        type="button"
        [attr.aria-label]="'toolbar.toc_open' | translate"
        [attr.title]="'toolbar.toc_open' | translate"
        (click)="onOpenToc()">
        <span class="btn-icon"><pw-icon name="lucideList" /></span>
        <span class="btn-label">{{ 'toolbar.toc' | translate }}</span>
      </button>

      <!-- Settings -->
      <button
        class="toolbar-btn"
        type="button"
        [attr.aria-label]="'toolbar.settings_open' | translate"
        [attr.title]="'toolbar.settings_open' | translate"
        (click)="onOpenSettings()">
        <span class="btn-icon"><pw-icon name="lucideSettings" /></span>
        <span class="btn-label">{{ 'toolbar.settings' | translate }}</span>
      </button>

      <!-- Characters -->
      <button
        class="toolbar-btn"
        type="button"
        [attr.aria-label]="'toolbar.characters_open' | translate"
        [attr.title]="'toolbar.characters_open' | translate"
        (click)="onOpenCharacters()">
        <span class="btn-icon"><pw-icon name="lucideUsers" /></span>
        <span class="btn-label">{{ 'toolbar.characters' | translate }}</span>
      </button>

      <!-- Alternatives (if available) -->
      @if (hasAlternatives) {
        <button
          class="toolbar-btn"
          type="button"
          aria-label="Alternative panels"
          title="Cycle through alternative panels"
          (click)="onCycleAlternative()">
          <span class="btn-icon"><pw-icon name="lucideRefreshCw" /></span>
          <span class="btn-label">Alt</span>
        </button>
      }

      <!-- Branch indicator (if choices ahead) -->
      @if (hasBranches) {
        <button
          class="toolbar-btn branch-indicator"
          type="button"
          aria-label="Choices ahead"
          title="View upcoming choices"
          (click)="onShowBranches()">
          <span class="btn-icon"><pw-icon name="lucideSplit" /></span>
          <span class="btn-label">Choices</span>
        </button>
      }

      <!-- Extras -->
      <button
        class="toolbar-btn"
        type="button"
        aria-label="Extras"
        title="View bonus content"
        (click)="onOpenExtras()">
        <span class="btn-icon"><pw-icon name="lucideSparkles" /></span>
        <span class="btn-label">Extras</span>
      </button>
    </div>

    <!-- Social cluster (rightmost) -->
    @if (showSocial) {
      <div class="toolbar-section toolbar-social">
        <button
          class="toolbar-btn icon-only"
          type="button"
          [class.active]="liked"
          [attr.aria-pressed]="liked"
          aria-label="Like"
          [title]="liked ? 'Remove like' : 'Like this work'"
          (click)="onLike()">
          <span class="btn-icon"><pw-icon name="lucideHeart" /></span>
        </button>

        <button
          class="toolbar-btn icon-only"
          type="button"
          [class.active]="bookmarked"
          [attr.aria-pressed]="bookmarked"
          aria-label="Bookmark"
          [title]="bookmarked ? 'Remove bookmark' : 'Bookmark this panel'"
          (click)="onBookmark()">
          <span class="btn-icon"><pw-icon name="lucideBookmark" /></span>
        </button>

        <button
          class="toolbar-btn icon-only"
          type="button"
          aria-label="Share"
          title="Share this panel"
          (click)="onShare()">
          <span class="btn-icon"><pw-icon name="lucideShare2" /></span>
        </button>

        <button
          class="toolbar-btn icon-only"
          type="button"
          aria-label="Comments"
          title="View comments"
          (click)="onOpenComments()">
          <span class="btn-icon"><pw-icon name="lucideMessageCircle" /></span>
        </button>
      </div>
    }

    <!-- Close button -->
    <button
      class="toolbar-btn close-btn"
      type="button"
      aria-label="Close toolbar"
      title="Close toolbar"
      (click)="onClose()">
      <span class="btn-icon"><pw-icon name="lucideX" /></span>
    </button>
  </div>
</div>
