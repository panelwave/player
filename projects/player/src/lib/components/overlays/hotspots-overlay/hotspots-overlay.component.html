<svg
  class="hotspots-svg"
  [class.non-interactive]="!interactive"
  [attr.viewBox]="'0 0 ' + containerWidth + ' ' + containerHeight"
  preserveAspectRatio="none"
  aria-hidden="false"
>
  @for (h of visibleHotspots; track h.id) {
    <g
      class="hotspot-shape"
      [class.choice]="choiceIds.has(h.id)"
      [class.selected]="selectedIds.has(h.id)"
      [class.indicator]="showIndicators && !choiceIds.has(h.id) && !selectedIds.has(h.id)"
      [attr.role]="interactive ? 'button' : null"
      [attr.tabindex]="interactive ? 0 : null"
      [attr.aria-label]="resolveLabel(h)"
      [attr.aria-pressed]="ariaPressed(h)"
      [attr.aria-current]="ariaCurrent(h)"
      (click)="onShapeClick(h, $event)"
      (keydown)="onKeyDown(h, $event)"
    >
      @switch (h.shape.type) {
        @case ('rect') {
          <rect
            [attr.x]="rectAttrs($any(h.shape)).x"
            [attr.y]="rectAttrs($any(h.shape)).y"
            [attr.width]="rectAttrs($any(h.shape)).width"
            [attr.height]="rectAttrs($any(h.shape)).height"
            rx="6"
          />
        }
        @case ('circle') {
          <circle
            [attr.cx]="circleAttrs($any(h.shape)).cx"
            [attr.cy]="circleAttrs($any(h.shape)).cy"
            [attr.r]="circleAttrs($any(h.shape)).r"
          />
        }
        @case ('polygon') {
          <polygon [attr.points]="polygonPoints($any(h.shape))" />
        }
      }
      @if (choiceText(h); as text) {
        <!-- A choice: its label is the button text (decorative; the g carries the accessible name). -->
        <foreignObject
          class="hotspot-label-box"
          [attr.x]="boundsOf(h.shape).x"
          [attr.y]="boundsOf(h.shape).y"
          [attr.width]="boundsOf(h.shape).width"
          [attr.height]="boundsOf(h.shape).height"
          aria-hidden="true">
          <xhtml:div class="hotspot-label" [style.font-size.px]="choiceFontSize(h)">{{ text }}</xhtml:div>
        </foreignObject>
      }
      @if (selectedIds.has(h.id)) {
        <!-- Selected: a check badge (decorative; the state is in aria-pressed / aria-current). -->
        @let badge = checkBadge(h);
        <g class="hotspot-check" aria-hidden="true">
          <circle [attr.cx]="badge.cx" [attr.cy]="badge.cy" [attr.r]="badge.r" />
          <path [attr.d]="badge.path" [attr.stroke-width]="badge.r * 0.32" />
        </g>
      }
    </g>
  }
</svg>
