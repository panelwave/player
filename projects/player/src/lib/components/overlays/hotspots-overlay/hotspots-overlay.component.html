<svg
  class="hotspots-svg"
  [class.non-interactive]="!interactive"
  [attr.viewBox]="'0 0 ' + containerWidth + ' ' + containerHeight"
  preserveAspectRatio="none"
  aria-hidden="false"
>
  @for (h of visibleHotspots; track h.id) {
    <g
      class="hotspot-shape"
      [class.indicator]="showIndicators"
      [attr.role]="interactive ? 'button' : null"
      [attr.tabindex]="interactive ? 0 : null"
      [attr.aria-label]="resolveLabel(h)"
      (click)="onShapeClick(h, $event)"
      (keydown)="onKeyDown(h, $event)"
    >
      @switch (h.shape.type) {
        @case ('rect') {
          <rect
            [attr.x]="rectAttrs($any(h.shape)).x"
            [attr.y]="rectAttrs($any(h.shape)).y"
            [attr.width]="rectAttrs($any(h.shape)).width"
            [attr.height]="rectAttrs($any(h.shape)).height"
            rx="6"
          />
        }
        @case ('circle') {
          <circle
            [attr.cx]="circleAttrs($any(h.shape)).cx"
            [attr.cy]="circleAttrs($any(h.shape)).cy"
            [attr.r]="circleAttrs($any(h.shape)).r"
          />
        }
        @case ('polygon') {
          <polygon [attr.points]="polygonPoints($any(h.shape))" />
        }
      }
    </g>
  }
</svg>
