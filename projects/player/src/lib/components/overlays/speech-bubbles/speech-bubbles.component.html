<div class="speech-bubbles-container">
  @for (bubble of bubbles; track bubble.id) {
    @if (isBubbleVisible(bubble)) {
      <div 
        class="speech-bubble"
        [class]="getBubbleStyleClass(bubble)"
        [class.toggleable]="bubble.toggleable"
        [style.transform]="getBubbleTransform(bubble)"
        [style.width.px]="getBubbleWidth(bubble)"
        [style.min-height.px]="getBubbleHeight(bubble)"
        (click)="onBubbleClick(bubble, $event)">
        
        <!-- Bubble content -->
        <div class="bubble-content">
          {{ getBubbleText(bubble) }}
        </div>

        <!-- SVG tail -->
        <svg 
          class="bubble-tail"
          [attr.viewBox]="'0 0 ' + getBubbleWidth(bubble) + ' ' + (getBubbleHeight(bubble) + 20)"
          xmlns="http://www.w3.org/2000/svg">
          <path
            [attr.d]="getTailPath(bubble)"
            class="tail-path" />
        </svg>
      </div>
    }
  }
</div>
