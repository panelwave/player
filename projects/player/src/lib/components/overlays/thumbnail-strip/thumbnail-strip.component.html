@if (visible) {
  <div class="thumbnail-strip">
    <!-- Close button -->
    <button
      class="close-btn"
      type="button"
      aria-label="Close thumbnail strip"
      (click)="onClose()">
      <pw-icon name="lucideX" />
    </button>

    <!-- Left arrow navigation -->
    <button
      class="nav-arrow nav-arrow-left"
      type="button"
      aria-label="Scroll left"
      [disabled]="!canScrollLeft()"
      [class.disabled]="!canScrollLeft()"
      (click)="scrollLeft()">
      <pw-icon name="lucideChevronLeft" />
    </button>

    <!-- Right arrow navigation -->
    <button
      class="nav-arrow nav-arrow-right"
      type="button"
      aria-label="Scroll right"
      [disabled]="!canScrollRight()"
      [class.disabled]="!canScrollRight()"
      (click)="scrollRight()">
      <pw-icon name="lucideChevronRight" />
    </button>

    <!-- Scroll container -->
    <div
      class="strip-scroll-container"
      #scrollContainer
      (scroll)="onScroll($event)"
      (mousedown)="onMouseDown($event)"
      (mousemove)="onMouseMove($event)"
      (mouseup)="onMouseUp()"
      (mouseleave)="onMouseLeave()">
      
      <!-- Content wrapper for virtual scrolling -->
      <div
        class="strip-content"
        [style.width.px]="getTotalWidth()">
        
        @for (item of getVisibleItems(); track item.key) {
          <div
            class="thumbnail-wrapper"
            [class.chapter-start]="item.chapterStart"
            [class.separator-wrapper]="item.kind === 'chapter'"
            [style.left.px]="item.left"
            [style.width.px]="item.width">

            @if (item.kind === 'chapter') {
              <!-- Chapter separator -->
              <button
                class="chapter-separator"
                [class.current-chapter]="item.isCurrentChapter"
                type="button"
                [attr.aria-label]="getItemLabel(item)"
                [attr.title]="item.chapterTitle"
                (click)="onNavigate(item)">
                <span class="separator-number">{{ item.chapterNumber }}</span>
                <span class="separator-title">{{ item.chapterTitle }}</span>
              </button>
            } @else {
              <!-- Thumbnail (cover or panel) -->
              <button
                class="thumbnail-item"
                [class.cover-item]="item.kind === 'cover'"
                [class.current]="item.isCurrentPanel"
                [class.current-chapter]="item.isCurrentChapter"
                [class.locked]="item.isLocked"
                type="button"
                [attr.aria-label]="getItemLabel(item)"
                [attr.aria-current]="item.isCurrentPanel ? 'true' : null"
                (click)="onNavigate(item)">

                @if (getThumbnailUrl(item)) {
                  <img
                    [src]="getThumbnailUrl(item)"
                    [alt]="getItemLabel(item)"
                    class="thumbnail-image"
                    draggable="false"
                    loading="lazy" />
                } @else {
                  <div class="thumbnail-placeholder">
                    <span class="placeholder-text">{{ item.panelId }}</span>
                  </div>
                }

                @if (item.kind === 'cover') {
                  <span class="cover-badge">Cover</span>
                }

                <!-- Lock overlay -->
                @if (item.isLocked) {
                  <div class="lock-overlay">
                    <span class="lock-icon"><pw-icon name="lucideLock" /></span>
                  </div>
                }

                <!-- Current indicator -->
                @if (item.isCurrentPanel) {
                  <div class="current-indicator"></div>
                }
              </button>
            }
          </div>
        }
      </div>
    </div>

    <!-- Navigation hints -->
    <div class="strip-hints">
      <kbd>←</kbd> <kbd>→</kbd> Navigate
      <span class="separator">•</span>
      <kbd>Esc</kbd> Close
    </div>
  </div>
}
