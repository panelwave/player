<div 
  class="viewport-container"
  [class]="getViewModeClass()"
  [class.reduced-motion]="reducedMotion"
  [class.interactive]="interactive"
  role="region"
  [attr.aria-label]="'Panel viewport'"
  tabindex="0"
  (click)="onViewportClick($event)"
  (keydown.enter)="onKeyboardActivate($event)"
  (keydown.space)="onKeyboardActivate($event)">
  
  <div 
    class="viewport-content"
    [style.transform]="getTransformStyle()"
    [style.transition]="reducedMotion ? 'none' : 'transform 0.3s ease'">
    
    @if (panel) {
      <div class="panel-container">
        <!-- Render layers using LayerRenderer -->
        @for (layer of panel.layers; track layer.id) {
          <pw-layer-renderer
            [layer]="layer"
            [locale]="locale"
            (layerClick)="layerClick.emit($event)">
          </pw-layer-renderer>
        }
      </div>
    } @else {
      <div class="no-panel">
        <p>No panel to display</p>
      </div>
    }
  </div>

  <!-- Overflow navigation arrows -->
  @if (showOverflowArrows && panel) {
    @if (hasOverflowLeft) {
      <button 
        class="overflow-arrow overflow-left"
        type="button"
        aria-label="Navigate left"
        (click)="navigateLeft()">
        ←
      </button>
    }

    @if (hasOverflowRight) {
      <button 
        class="overflow-arrow overflow-right"
        type="button"
        aria-label="Navigate right"
        (click)="navigateRight()">
        →
      </button>
    }

    @if (hasOverflowTop) {
      <button 
        class="overflow-arrow overflow-top"
        type="button"
        aria-label="Navigate up"
        (click)="navigateUp()">
        ↑
      </button>
    }

    @if (hasOverflowBottom) {
      <button 
        class="overflow-arrow overflow-bottom"
        type="button"
        aria-label="Navigate down"
        (click)="navigateDown()">
        ↓
      </button>
    }
  }
</div>
