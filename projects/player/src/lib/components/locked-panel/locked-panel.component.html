<div class="pw-locked-panel"
     [class.pw-locked-panel--actionable]="actionable"
     [attr.role]="actionable ? 'button' : 'img'"
     [attr.tabindex]="actionable ? 0 : null"
     [attr.aria-label]="actionable ? t('unlock') : t('title')"
     (click)="onActivate($event)"
     (keydown.enter)="onActivate($event)"
     (keydown.space)="onActivate($event)">
  <svg class="pw-locked-panel__icon" viewBox="0 0 24 24" width="32" height="32" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true" focusable="false">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
  </svg>
  <p class="pw-locked-panel__title">{{ t('title') }}</p>
  <p class="pw-locked-panel__message">{{ t('message') }}</p>
</div>
