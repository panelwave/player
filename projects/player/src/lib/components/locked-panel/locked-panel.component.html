<div class="pw-locked-panel" role="img" [attr.aria-label]="t('title')">
  <svg class="pw-locked-panel__icon" viewBox="0 0 24 24" width="32" height="32" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true" focusable="false">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
  </svg>
  <p class="pw-locked-panel__title">{{ t('title') }}</p>
  <p class="pw-locked-panel__message">{{ t('message') }}</p>
</div>
