<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample PanelWave Plugin</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .plugin-container {
      max-width: 400px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .status {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .button {
      background: white;
      color: #667eea;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    .button:hover {
      opacity: 0.9;
    }

    .output {
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="plugin-container">
    <h1>🔌 Sample Plugin</h1>
    
    <div class="status">
      <strong>Status:</strong> <span id="status">Initializing...</span>
    </div>

    <div>
      <button class="button" onclick="getManifest()">Get Manifest</button>
      <button class="button" onclick="getPlayerState()">Get State</button>
      <button class="button" onclick="getCurrentPanel()">Get Panel</button>
    </div>

    <div class="output" id="output">
      Plugin loaded successfully!
    </div>
  </div>

  <script>
    // PanelWave Plugin SDK
    const PLUGIN_ID = 'sample-plugin';
    let requestId = 0;
    const pendingRequests = new Map();

    // Send message to host
    function sendMessage(type, payload) {
      window.parent.postMessage({
        type,
        pluginId: PLUGIN_ID,
        requestId: requestId++,
        payload
      }, '*');
    }

    // Call API method
    function callAPI(method, ...params) {
      const id = requestId++;
      return new Promise((resolve, reject) => {
        pendingRequests.set(id, { resolve, reject });
        sendMessage('api:call', { method, params });
      });
    }

    // Handle messages from host
    window.addEventListener('message', (event) => {
      const message = event.data;
      
      if (!message || message.pluginId !== PLUGIN_ID) {
        return;
      }

      // Handle lifecycle
      if (message.type === 'plugin:mount') {
        log('Plugin mounted', message.payload);
        updateStatus('Mounted');
        sendMessage('plugin:mounted', {});
      }

      if (message.type === 'plugin:unmount') {
        log('Plugin unmounting');
        updateStatus('Unmounting');
      }

      if (message.type === 'plugin:update') {
        log('Plugin updated', message.payload);
      }

      // Handle API responses
      if (message.type === 'api:response') {
        const pending = pendingRequests.get(message.requestId);
        if (pending) {
          pending.resolve(message.payload.result);
          pendingRequests.delete(message.requestId);
        }
      }

      if (message.type === 'api:error') {
        const pending = pendingRequests.get(message.requestId);
        if (pending) {
          pending.reject(new Error(message.error));
          pendingRequests.delete(message.requestId);
        }
      }

      // Handle events
      if (message.type === 'event:emit') {
        log('Event received', message.payload);
      }
    });

    // Plugin API
    async function getManifest() {
      try {
        const manifest = await callAPI('getManifest');
        log('Manifest:', manifest);
      } catch (error) {
        log('Error:', error.message);
      }
    }

    async function getPlayerState() {
      try {
        const state = await callAPI('getPlayerState');
        log('Player State:', state);
      } catch (error) {
        log('Error:', error.message);
      }
    }

    async function getCurrentPanel() {
      try {
        const panel = await callAPI('getCurrentPanel');
        log('Current Panel:', panel);
      } catch (error) {
        log('Error:', error.message);
      }
    }

    // Utilities
    function log(message, data) {
      const output = document.getElementById('output');
      const line = document.createElement('div');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      if (data) {
        line.textContent += ': ' + JSON.stringify(data, null, 2);
      }
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    function updateStatus(status) {
      document.getElementById('status').textContent = status;
    }

    // Initialize
    updateStatus('Ready');
    sendMessage('plugin:ready', {});
    log('Plugin initialized');
  </script>
</body>
</html>
