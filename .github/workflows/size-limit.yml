# Bundle-size check on pull requests: builds the library and fails when the
# player grows past the budget. The budget applies to what a host app ships:
# the FESM bundle minified (as every host build minifies it) and gzipped.
# 180 KB is the accepted target (decided 2026-09-25, re-confirmed 2026-09-27);
# never raise it. The raw (unminified, comment-carrying) gzipped size is
# reported for reference only.
name: size-limit

on:
  pull_request:

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build library
        run: npx ng build player --configuration production

      - name: Check minified + gzipped size of the FESM bundle
        run: |
          BUDGET_KB=180
          FILE=$(ls dist/player/fesm2022/*.mjs | head -1)
          npx esbuild "$FILE" --minify --format=esm --log-level=error > /tmp/player.min.mjs
          KB=$(( $(gzip -c /tmp/player.min.mjs | wc -c) / 1024 ))
          RAW_KB=$(( $(gzip -c "$FILE" | wc -c) / 1024 ))
          echo "$(basename "$FILE"): ${KB} KB minified+gzipped (budget ${BUDGET_KB} KB); raw gzipped ${RAW_KB} KB"
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(basename "$FILE")\`: **${KB} KB** minified + gzipped (budget ${BUDGET_KB} KB); raw gzipped ${RAW_KB} KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$KB" -gt "$BUDGET_KB" ]; then
            echo "::error::bundle exceeds the ${BUDGET_KB} KB minified+gzipped budget"
            exit 1
          fi
